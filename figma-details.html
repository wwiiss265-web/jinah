<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>스마트 옷장 앱 | 오늘 뭐 입지?</title>
  <meta name="description" content="스마트 옷장 앱 오늘 뭐 입지? UI/UX 디자인 포트폴리오">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg?v=2">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <style>
    body.figma-project-page { background: #fff; font-family: 'Noto Sans KR', sans-serif; }
    .figma-project-header { padding: 34px 0 22px; }
    .figma-project-header .back-link { color: #555; text-decoration: none; font-size: 14px; }
    .figma-project-header .back-link:hover { color: #d66f78; }
    .figma-project-header h1 { margin: 18px 0 8px; font-size: clamp(24px, 3vw, 36px); font-weight: 700; color: #292929; }
    .figma-project-header p { margin: 0; color: #666; font-size: 15px; }
    .figma-project-image { padding: 10px 0 70px; }
    .figma-project-image img { display: block; width: 100%; height: auto; }
    .detail-image-wrap { position: relative; max-width: 1100px; margin: 0 auto; }
    .video-hotspot { position: absolute; left: 14%; top: 97.65%; width: 25%; height: 1.55%; border: 0; background: transparent; cursor: pointer; }
    .video-hotspot:focus-visible { outline: 3px solid #d66f78; outline-offset: 3px; border-radius: 28px; }
    .video-modal { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(20,20,20,.88); }
    .video-modal.is-open { display: flex; }
    .video-modal__content { position: relative; width: min(420px, 92vw); }
    .video-modal video { display: block; width: 100%; max-height: 85vh; background: #000; border-radius: 12px; }
    .video-modal__close { position: absolute; top: -42px; right: 0; border: 0; background: transparent; color: #fff; font-size: 30px; cursor: pointer; }
    @media (max-width: 575px) { .figma-project-header { padding-top: 24px; } .figma-project-image { padding-bottom: 36px; } .detail-image-wrap { width: 100%; } }
  </style>
</head>
<body class="figma-project-page">
  <main>
    <section class="figma-project-header">
      <div class="container">
        <a class="back-link" href="index.html#portfolio"><i class="bi bi-arrow-left"></i> 포트폴리오로 돌아가기</a>
        <h1>스마트 옷장 앱 · 오늘 뭐 입지?</h1>
        <p>UI / UX DESIGN · Figma</p>
      </div>
    </section>
    <section class="figma-project-image">
      <div class="container">
        <div class="detail-image-wrap">
          <img src="assets/img/details/d_07.png" alt="스마트 옷장 앱 오늘 뭐 입지? 상세 디자인 포트폴리오">
          <button class="video-hotspot" type="button" aria-label="앱 미리보기 영상 재생" title="영상 미리보기"></button>
        </div>
      </div>
    </section>
  </main>
  <div class="video-modal" id="appVideoModal" role="dialog" aria-modal="true" aria-label="앱 미리보기 영상">
    <div class="video-modal__content">
      <button class="video-modal__close" type="button" aria-label="닫기">×</button>
      <video id="appPreviewVideo" controls playsinline preload="metadata">
        <source src="assets/video/app-preview.mp4" type="video/mp4">
        브라우저에서 동영상을 재생할 수 없습니다.
      </video>
    </div>
  </div>
  <script>
    (() => {
      const hotspot = document.querySelector('.video-hotspot');
      const modal = document.getElementById('appVideoModal');
      const video = document.getElementById('appPreviewVideo');
      const close = modal.querySelector('.video-modal__close');
      function openVideo() {
        modal.classList.add('is-open');
        video.currentTime = 0;
        video.play().catch(() => {});
      }
      function closeVideo() {
        video.pause();
        video.currentTime = 0;
        modal.classList.remove('is-open');
      }
      hotspot.addEventListener('click', openVideo);
      close.addEventListener('click', closeVideo);
      modal.addEventListener('click', (event) => { if (event.target === modal) closeVideo(); });
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && modal.classList.contains('is-open')) closeVideo(); });
    })();
  </script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
